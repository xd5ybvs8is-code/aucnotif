[project]
name = "auknotif"
version = "0.1.0"
description = "Telegram bot for monitoring Yahoo Auctions Japan"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "arq>=0.26,<0.27",
    "asyncpg>=0.29",
    "fastapi>=0.111",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "sentry-sdk>=2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "structlog>=24.1",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "fakeredis[lua]>=2.37",
    "lupa>=2.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
